# Hourly cloud scrape of recently-played into the private data repo.
name: Spotify hourly sync

on:
  workflow_dispatch: {}  # triggered externally by cron-job.org every hour

# Never let two runs touch the data repo at once.
concurrency:
  group: spotify-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code (this repo)
        uses: actions/checkout@v4

      - name: Checkout private data repo
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.DATA_REPO }}
          token: ${{ secrets.DATA_REPO_PAT }}
          path: _data

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Sync recently-played into the data repo
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_HISTORY_DIR: ./_data
        run: python cloud_sync.py

      - name: Warn if authorization nears its 6-month expiry
        if: always()
        env:
          AUTH_DATE: ${{ vars.SPOTIFY_AUTH_DATE }}   # optional YYYY-MM-DD of last local re-auth
        run: |
          if [ -n "$AUTH_DATE" ]; then
            days=$(( ( $(date -u +%s) - $(date -u -d "$AUTH_DATE" +%s) ) / 86400 ))
            if [ "$days" -ge 150 ]; then
              echo "::warning::Spotify authorization is $days days old (expires at ~180). Re-authorize locally and commit a new live_token.json soon."
            fi
          fi

      - name: Commit & push updated live buffer + token
        working-directory: _data
        run: |
          git config user.name "spotify-sync-bot"
          git config user.email "spotify-sync-bot@users.noreply.github.com"
          git add Streaming_History_Audio_live.json live_token.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "sync: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi

      - name: Flag failure
        if: failure()
        run: echo "::error::Spotify sync failed. If this is invalid_grant, re-authorize locally and commit a new live_token.json to the data repo. GitHub emails the repo owner on workflow failure."
